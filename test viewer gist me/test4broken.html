<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GistMe - The Live Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Space+Grotesk:wght@300;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CORE --- */
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: white; overflow: hidden; }
        h1, h2, .brand-font { font-family: 'Carter One', cursive; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* --- 1. HAPTIC AUDIO PULSE (The Club Vibe) --- */
        /* This overlay sits on top of everything but ignores clicks */
        #haptic-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 100;
            mix-blend-mode: screen; /* Makes colors glow */
        }
        
        /* The Pulse Animations */
        @keyframes pulse-beat {
            0% { box-shadow: inset 0 0 0 0 transparent; }
            40% { box-shadow: inset 0 0 60px 20px var(--pulse-color); }
            100% { box-shadow: inset 0 0 0 0 transparent; }
        }
        .haptic-active { animation: pulse-beat 1.2s infinite cubic-bezier(0.4, 0, 0.6, 1); }

        /* --- 2. FIREFLIES (Campfire Presence) --- */
        .firefly {
            position: absolute;
            width: 4px; height: 4px;
            background-color: #fbbf24;
            border-radius: 50%;
            box-shadow: 0 0 8px 2px rgba(251, 191, 36, 0.6);
            opacity: 0;
            animation: float-firefly 10s infinite linear;
        }
        @keyframes float-firefly {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate(var(--move-x), var(--move-y)); opacity: 0; }
        }

        /* --- 3. FLOATING COMMENTS (YouTube Live Style) --- */
        .comment-stream-container {
            position: absolute; bottom: 120px; left: 20px; width: 200px; height: 300px;
            pointer-events: none; overflow: hidden; mask-image: linear-gradient(to top, black 50%, transparent 100%);
        }
        .floating-comment {
            position: absolute; bottom: -50px; left: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            padding: 6px 12px; rounded: 20px; border-radius: 99px;
            font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.1);
            animation: float-up-fade 6s forwards ease-out;
            white-space: nowrap; max-width: 100%; text-overflow: ellipsis; overflow: hidden;
        }
        @keyframes float-up-fade {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { transform: translateY(-20px) scale(1); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-350px) scale(0.9); opacity: 0; }
        }

        /* --- PARALLAX UTILS --- */
        .parallax-wrapper { height: 100vh; overflow-y: auto; overflow-x: hidden; perspective: 10px; scroll-snap-type: y mandatory; }
        .parallax-card { position: relative; height: 100vh; transform-style: preserve-3d; z-index: -1; scroll-snap-align: start; }
        .parallax-bg { position: absolute; inset: 0; z-index: -1; transform: translateZ(-10px) scale(2); background-size: cover; background-position: center; }
        .parallax-content { transform: translateZ(0); width: 100%; height: 100%; pointer-events: none; }
        .parallax-content > * { pointer-events: auto; }

        /* Animation for Griot */
        @keyframes griot-talk { 0%, 100% { height: 2px; } 50% { height: 8px; } }
        .talking-mouth { animation: griot-talk 0.3s infinite; }
    </style>
</head>
<body class="bg-black text-white">

    <div x-data="gistApp()">
        
        <div id="haptic-overlay" 
             :class="isPlaying ? 'haptic-active' : ''"
             :style="`--pulse-color: ${getPulseColor(currentStory?.category)}`">
        </div>

        <div x-show="showCommentInput" 
             class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center"
             x-transition.opacity
             @click.self="showCommentInput = false"> <div class="bg-gray-900 border-t border-gray-700 w-full sm:w-96 p-6 rounded-t-3xl sm:rounded-2xl space-y-4"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-y-full"
                 x-transition:enter-end="translate-y-0">
                
                <h3 class="font-bold text-gray-400 uppercase text-xs tracking-widest">Join the conversation</h3>
                <textarea x-model="newCommentText" 
                          class="w-full bg-black/50 border border-gray-700 rounded-xl p-4 text-white focus:outline-none focus:border-yellow-500" 
                          rows="3" 
                          placeholder="What's your take?"></textarea>
                
                <div class="flex justify-end space-x-3">
                    <button @click="showCommentInput = false" class="text-sm text-gray-500 font-bold px-4 py-2">CANCEL</button>
                    <button @click="sendComment()" 
                            class="bg-yellow-500 hover:bg-yellow-400 text-black font-black px-6 py-2 rounded-full transform active:scale-95 transition">
                        SEND GIST
                    </button>
                </div>
            </div>
        </div>


        <div class="parallax-wrapper no-scrollbar">
            
            <template x-for="story in stories" :key="story.id">
                <div class="parallax-card group flex items-end justify-center">
                    
                    <div class="parallax-bg" 
                         :class="!story.thumbnail ? 'bg-gray-900' : ''"
                         :style="story.thumbnail ? `background-image: url('${story.thumbnail}');` : ''">
                        
                        <div class="absolute inset-0 bg-black/50"></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                        
                        <div class="absolute inset-0 overflow-hidden">
                            <template x-for="i in 15">
                                <div class="firefly" 
                                     :style="`top: ${Math.random() * 100}%; left: ${Math.random() * 100}%; 
                                              --move-x: ${Math.random() * 100 - 50}px; --move-y: -${Math.random() * 100 + 50}px; 
                                              animation-delay: ${Math.random() * 5}s; animation-duration: ${10 + Math.random() * 10}s;`">
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="parallax-content flex flex-col justify-end p-6 pb-24 relative w-full max-w-md mx-auto">
                        
                        <div class="comment-stream-container">
                             <template x-for="comment in activeComments.filter(c => c.storyId === story.id)" :key="comment.id">
                                 <div class="floating-comment"
                                      :style="`left: ${Math.random() * 20}px; animation-duration: ${4 + Math.random() * 2}s`">
                                     <span class="font-bold text-yellow-500 text-[10px]" x-text="comment.user"></span> 
                                     <span x-text="comment.text"></span>
                                 </div>
                             </template>
                        </div>

                        <span class="text-xs font-bold text-yellow-500 uppercase tracking-widest mb-2" x-text="story.category"></span>
                        <h2 class="text-4xl leading-none mb-3 drop-shadow-lg" x-text="story.title"></h2>
                        <p class="text-gray-200 line-clamp-2 mb-8 text-shadow-sm" x-text="story.summary"></p>

                        <div class="absolute right-4 bottom-24 flex flex-col space-y-6 items-center pointer-events-auto z-50">
                            
                            <button class="flex flex-col items-center group/btn">
                                <div class="bg-white/10 p-3 rounded-full backdrop-blur-md border border-white/20 group-hover/btn:bg-red-500/20 group-hover/btn:border-red-500 transition">
                                    ❤️
                                </div>
                                <span class="text-[10px] font-bold mt-1">1.2k</span>
                            </button>
                            
                            <button @click="openCommentModal(story.id)" class="flex flex-col items-center group/btn">
                                <div class="bg-white/10 p-3 rounded-full backdrop-blur-md border border-white/20 group-hover/btn:bg-blue-500/20 group-hover/btn:border-blue-500 transition">
                                    💬
                                </div>
                                <span class="text-[10px] font-bold mt-1" x-text="getCommentCount(story.id)"></span>
                            </button>

                            <button class="bg-white/10 p-3 rounded-full backdrop-blur-md border border-white/20">
                                📤
                            </button>
                        </div>

                        <div class="absolute bottom-6 left-0 right-0 flex justify-center pointer-events-auto">
                            <button @click="togglePlay(story)" class="relative group active:scale-95 transition-transform">
                                <div class="absolute inset-0 bg-purple-600 blur-2xl opacity-40 group-hover:opacity-70 transition"></div>
                                <svg class="w-16 h-16 text-white fill-current relative z-10" viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="#1e1b4b" stroke="currentColor"/>
                                    <circle cx="9" cy="9" r="1.5" class="text-purple-400" fill="currentColor"/>
                                    <circle cx="15" cy="9" r="1.5" class="text-purple-400" fill="currentColor"/>
                                    <rect x="10" y="14" width="4" height="2" rx="1" class="text-yellow-400" fill="currentColor" :class="isPlaying && currentStory?.id === story.id ? 'talking-mouth' : ''"></rect>
                                </svg>
                            </button>
                        </div>

                    </div>
                </div>
            </template>
        </div>

    </div>

    <script>
        function gistApp() {
            return {
                isPlaying: false,
                currentStory: null,
                showCommentInput: false,
                newCommentText: '',
                targetStoryId: null, // Which story are we commenting on?
                
                // We keep comments in a flat array for the demo. 
                // In production, this comes from HTMX/Django
                activeComments: [
                    { id: 1, storyId: 1, user: 'Tunde', text: 'This is huge for Buea! 🚀' },
                    { id: 2, storyId: 1, user: 'Sarah', text: 'Finally some good news.' }
                ],

                stories: [
                    { id: 1, category: "Tech", title: "Buea Tech Valley Raises $2M", summary: "The Silicon Mountain community celebrates a massive injection of foreign capital.", thumbnail: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=1000&auto=format&fit=crop" },
                    { id: 2, category: "Vibe", title: "Libianca Breaks Billboard Record", summary: "From Bamenda to the world, the star hits #1 global chart status.", thumbnail: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=1000&auto=format&fit=crop" },
                    { id: 3, category: "Policy", title: "New Digital ID Rolling Out", summary: "Government announces streamlined biometric ID process starting Monday.", thumbnail: null } 
                ],

                togglePlay(story) {
                    if (this.currentStory?.id === story.id && this.isPlaying) {
                        this.isPlaying = false;
                    } else {
                        this.currentStory = story;
                        this.isPlaying = true;
                        // In real app: audio.play()
                    }
                },

                // Pulse Color Logic based on Category
                getPulseColor(category) {
                    switch(category) {
                        case 'Tech': return '#3b82f6'; // Blue
                        case 'Vibe': return '#eab308'; // Gold/Yellow
                        case 'Policy': return '#ef4444'; // Red
                        default: return '#a855f7'; // Purple
                    }
                },

                // --- COMMENT LOGIC ---
                openCommentModal(id) {
                    this.targetStoryId = id;
                    this.showCommentInput = true;
                },

                getCommentCount(id) {
                    return this.activeComments.filter(c => c.storyId === id).length;
                },

                sendComment() {
                    if (!this.newCommentText.trim()) return;

                    // 1. Add to array (Logic triggers x-for loop)
                    const newComment = {
                        id: Date.now(),
                        storyId: this.targetStoryId,
                        user: 'You',
                        text: this.newCommentText
                    };
                    
                    this.activeComments.push(newComment);

                    // 2. Clear & Close
                    this.newCommentText = '';
                    this.showCommentInput = false;

                    // 3. Remove from array after animation (6s) to keep DOM light
                    // In a real app you might keep them, but for "Floating" effect, we can remove visually.
                    setTimeout(() => {
                        this.activeComments = this.activeComments.filter(c => c.id !== newComment.id);
                    }, 6500);
                }
            }
        }
    </script>
</body>
</html>

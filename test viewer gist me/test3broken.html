<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GistMe - The Digital Griot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">

    <style>
        /* --- CORE --- */
        body { font-family: 'Space Grotesk', sans-serif; background-color: #050505; color: white; overflow: hidden; }
        h1, h2, .brand-font { font-family: 'Carter One', cursive; }
        
        /* --- PARALLAX SCROLLING CONTAINER --- */
        /* The magic trick for mobile-friendly parallax with snap scrolling */
        .parallax-wrapper {
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            perspective: 10px; /* Establishes depth */
            scroll-snap-type: y mandatory;
        }
        
        .parallax-card {
            position: relative;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            z-index: -1;
            scroll-snap-align: start;
        }

        /* The Background moves slower than foreground */
        .parallax-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            transform: translateZ(-10px) scale(2); /* Pushes it back and scales up to fill */
            background-size: cover;
            background-position: center;
        }

        /* The Content floats on top */
        .parallax-content {
            transform: translateZ(0); /* Keeps it at base depth */
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to buttons */
        }
        
        /* Allow pointer events on interactive children */
        .parallax-content > * { pointer-events: auto; }

        /* --- ANIMATIONS --- */
        /* The Neon Griot (Face) Pulse */
        @keyframes griot-breathe {
            0%, 100% { filter: drop-shadow(0 0 5px #a855f7); transform: scale(1); }
            50% { filter: drop-shadow(0 0 15px #d8b4fe); transform: scale(1.02); }
        }
        .griot-face { animation: griot-breathe 3s ease-in-out infinite; }
        
        /* The Talking Drum (Like) Hit */
        @keyframes drum-hit {
            0% { transform: scale(1); }
            20% { transform: scale(1.4) rotate(-5deg); }
            40% { transform: scale(0.9) rotate(5deg); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .drum-active { animation: drum-hit 0.4s ease-out; color: #ef4444; }
        
        /* Ripple effect for the drum */
        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            100% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
        }
        .drum-ripple { animation: ripple 0.6s linear; }

        /* --- PATTERNS --- */
        .bg-pattern-cyber {
            background-color: #111;
            background-image: linear-gradient(30deg, #222 12%, transparent 12.5%, transparent 87%, #222 87.5%, #222),
            linear-gradient(150deg, #222 12%, transparent 12.5%, transparent 87%, #222 87.5%, #222),
            linear-gradient(30deg, #222 12%, transparent 12.5%, transparent 87%, #222 87.5%, #222),
            linear-gradient(150deg, #222 12%, transparent 12.5%, transparent 87%, #222 87.5%, #222),
            linear-gradient(60deg, #333 25%, transparent 25.5%, transparent 75%, #333 75.5%, #333),
            linear-gradient(60deg, #333 25%, transparent 25.5%, transparent 75%, #333 75.5%, #333);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white">

    <div x-data="gistApp()">
        
        <div class="fixed top-0 left-0 w-full z-50 p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
            <span class="brand-font text-2xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 drop-shadow-lg">GistMe</span>
            <div class="flex space-x-2 pointer-events-auto">
                <span class="text-xs bg-gray-800/80 backdrop-blur px-3 py-1 rounded-full border border-gray-600">Daily Streak: 🔥 4</span>
            </div>
        </div>

        <div class="parallax-wrapper no-scrollbar">
            
            <template x-for="story in stories" :key="story.id">
                <div class="parallax-card group">
                    
                    <div class="parallax-bg inset-0" 
                         :class="story.thumbnail ? '' : 'bg-pattern-cyber'"
                         :style="story.thumbnail ? `background-image: url('${story.thumbnail}');` : ''">
                        <div class="absolute inset-0 bg-black/60"></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                    </div>

                    <div class="parallax-content flex flex-col justify-end p-6 pb-24 relative">
                        
                        <div class="mb-4 transform translate-y-4 opacity-0 transition duration-700 group-hover:translate-y-0 group-hover:opacity-100 delay-100">
                             <span class="px-3 py-1 rounded-full border border-purple-500 bg-purple-900/40 text-xs font-bold uppercase tracking-wider backdrop-blur-md"
                                   x-text="story.category"></span>
                        </div>

                        <h2 class="text-4xl md:text-5xl leading-tight mb-2 drop-shadow-xl transform translate-y-8 opacity-0 transition duration-700 group-hover:translate-y-0 group-hover:opacity-100 delay-200"
                            style="text-shadow: 2px 2px 0 #000;"
                            x-text="story.title"></h2>

                        <p class="text-lg text-gray-200 font-light mb-4 line-clamp-3 drop-shadow-md transform translate-y-8 opacity-0 transition duration-700 group-hover:translate-y-0 group-hover:opacity-100 delay-300"
                           x-text="story.summary"></p>
                        
                        <div class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-10 transform translate-y-8 opacity-0 transition duration-700 group-hover:translate-y-0 group-hover:opacity-100 delay-400">
                            Source: <span x-text="story.source"></span>
                        </div>


                        <div class="absolute bottom-6 left-0 right-0 flex justify-center z-50 pointer-events-auto">
                            <button @click="togglePlay(story)" 
                                    class="relative group/griot focus:outline-none transition-transform active:scale-95">
                                
                                <div class="absolute inset-0 bg-purple-600 rounded-full blur-xl opacity-30 group-hover/griot:opacity-60 transition duration-500"></div>
                                
                                <svg class="w-20 h-20 griot-face text-white fill-current" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="#1e1b4b" stroke="currentColor" stroke-width="0.5"/>
                                    <path d="M8.5 10C8.5 10.83 9.17 11.5 10 11.5C10.83 11.5 11.5 10.83 11.5 10C11.5 9.17 10.83 8.5 10 8.5C9.17 8.5 8.5 9.17 8.5 10Z" class="text-purple-400" fill="currentColor"/>
                                    <path d="M12.5 10C12.5 10.83 13.17 11.5 14 11.5C14.83 11.5 15.5 10.83 15.5 10C15.5 9.17 14.83 8.5 14 8.5C13.17 8.5 12.5 9.17 12.5 10Z" class="text-purple-400" fill="currentColor"/>
                                    <rect x="9" y="14" width="6" height="2" rx="1" class="text-yellow-400" fill="currentColor">
                                        <animate attributeName="height" values="2; 4; 2" dur="0.5s" repeatCount="indefinite" begin="click" />
                                    </rect>
                                    <path d="M12 4V7" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                    <path d="M5 12H7" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                    <path d="M17 12H19" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                </svg>
                                
                                <span class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 text-[10px] font-bold uppercase tracking-widest text-purple-300 w-full text-center">
                                    Ask the Griot
                                </span>
                            </button>
                        </div>


                        <div class="absolute right-4 bottom-1/3 flex flex-col items-center space-y-8 z-50 pointer-events-auto">
                            
                            <button @click="beatDrum(story.id)" class="group/drum relative flex flex-col items-center">
                                <div class="p-3 rounded-full bg-white/10 backdrop-blur-sm border border-white/20 transition-all duration-300"
                                     :class="isLiked(story.id) ? 'drum-active bg-red-900/40 border-red-500' : ''">
                                     
                                    <svg viewBox="0 0 24 24" fill="currentColor" class="w-8 h-8 transition-colors" :class="isLiked(story.id) ? 'text-red-500' : 'text-white'">
                                        <path d="M6 2h12v4l-2 2v6l2 2v6H6v-6l2-2V8L6 6V2z" /> <path d="M6 4h12" stroke="currentColor" stroke-width="1" />
                                        <path d="M8 8l8 12" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
                                        <path d="M16 8l-8 12" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
                                    </svg>
                                </div>
                                <span class="text-xs font-bold mt-2 text-white/80" x-text="story.likes"></span>
                            </button>

                            <button class="flex flex-col items-center opacity-70 hover:opacity-100 transition">
                                <div class="p-3 rounded-full bg-white/10 backdrop-blur-sm border border-white/20">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-7 h-7">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" />
                                    </svg>
                                </div>
                            </button>
                        </div>

                    </div>
                </div>
            </template>
        </div>

        <div x-show="isPlaying" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 translate-y-full"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-full"
             class="fixed inset-x-0 bottom-0 z-[100] bg-[#111] border-t border-gray-800 p-4 rounded-t-3xl shadow-2xl">
            
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-gray-800 border-2 border-purple-500 overflow-hidden animate-[spin_4s_linear_infinite]">
                        <img :src="currentStory?.thumbnail || 'https://via.placeholder.com/100'" class="w-full h-full object-cover opacity-60">
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-white max-w-[200px] truncate" x-text="currentStory?.title"></h4>
                        <p class="text-xs text-purple-400">Griot is speaking...</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-400 hover:text-white">⏮</button>
                    <button @click="isPlaying = false" class="bg-white text-black rounded-full p-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="w-full bg-gray-800 h-1 mt-4 rounded-full overflow-hidden">
                <div class="bg-purple-500 h-full w-1/3"></div>
            </div>
        </div>

    </div>

    <script>
        function gistApp() {
            return {
                isPlaying: false,
                currentStory: null,
                likedStories: new Set(),
                
                stories: [
                    { id: 1, category: "Tech", title: "Buea Tech Valley Secures $2M Fund", summary: "The Silicon Mountain community celebrates a massive injection of foreign capital to boost local startups.", source: "AfroTech", likes: "1.2k", thumbnail: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=1000&auto=format&fit=crop" },
                    { id: 2, category: "Music", title: "Libianca Hits #1 on Billboard", summary: "The Cameroonian star continues her meteoric rise, breaking records across three continents this week.", source: "Trace Urban", likes: "8.5k", thumbnail: "https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=1000&auto=format&fit=crop" },
                    { id: 3, category: "Policy", title: "New Digital ID Cards Rolling Out", summary: "Government announces a streamlined process for obtaining the new biometric ID cards starting Monday.", source: "CRTV", likes: "450", thumbnail: null }, // Uses Pattern
                    { id: 4, category: "Culture", title: "The Ngondo Festival Returns", summary: "Douala prepares for the sacred feast of the water spirits. Here is everything you need to know.", source: "Canal 2", likes: "3.1k", thumbnail: "https://images.unsplash.com/photo-1560963689-02e022c00223?q=80&w=1000&auto=format&fit=crop" },
                ],

                togglePlay(story) {
                    this.currentStory = story;
                    this.isPlaying = !this.isPlaying;
                },

                beatDrum(id) {
                    if (this.likedStories.has(id)) {
                        this.likedStories.delete(id);
                        // In real app, decrement count
                    } else {
                        this.likedStories.add(id);
                        // Haptic feedback for mobile
                        if (navigator.vibrate) navigator.vibrate([50, 50, 50]); 
                    }
                },

                isLiked(id) {
                    return this.likedStories.has(id);
                }
            }
        }
    </script>
</body>
</html>
